<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f2">
    <meta name="description" content="합덕제철고등학교 학사일정을 월별로 확인하세요.">
    <title>학사일정 | 합덕제철고등학교</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body data-page="academic">
    <header class="site-header">
      <a class="brand" href="./" aria-label="합덕제철고등학교 급식표">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span class="brand-copy">
          <strong>합덕제철고등학교</strong>
          <span>학교생활 안내</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="./">급식표</a>
        <a href="timetable.html">시간표</a>
        <a href="academic.html" aria-current="page">학사일정</a>
      </nav>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">HAPDEOK STEEL INDUSTRY HIGH SCHOOL</p>
        <div class="intro-layout">
          <div class="intro-copy-block">
            <h1 id="page-title">학교의 중요한 날을<br><span>월별로 확인해요.</span></h1>
            <p class="intro-copy">학사일정을 월별로 살펴보고 행사 날짜를 확인하세요.</p>
          </div>
          <aside class="today-card" aria-label="오늘 날짜">
            <span class="today-label">TODAY IN HAPDEOK</span>
            <strong id="today-date" class="today-date">날짜</strong>
            <span id="today-weekday" class="today-weekday">요일</span>
            <span class="today-decoration" aria-hidden="true">H</span>
          </aside>
        </div>
      </section>

      <div id="status-message" class="status-message" role="status" hidden></div>

      <section class="panel academic-panel" aria-labelledby="academic-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">SCHOOL CALENDAR</p>
            <h2 id="academic-title">월별 학사일정</h2>
          </div>
          <span class="section-icon academic-icon" aria-hidden="true">일정</span>
        </div>
        <div class="academic-month-row">
          <button id="academic-prev" class="icon-button" type="button" aria-label="이전 달 학사일정 보기">←</button>
          <p id="academic-month" class="academic-month" aria-live="polite"></p>
          <button id="academic-next" class="icon-button" type="button" aria-label="다음 달 학사일정 보기">→</button>
        </div>
        <ol id="academic-events" class="academic-events">
          <li class="empty-state">학사일정을 불러오는 중입니다.</li>
        </ol>
        <p class="data-caption">학사일정 제공: 나이스 교육정보 개방 포털</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>합덕제철고등학교 학교생활 안내</span>
      <span>데이터 출처: 나이스 교육정보 개방 포털</span>
    </footer>
  </body>
</html>
